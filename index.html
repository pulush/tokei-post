<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>⌚ 時計転売 投稿ツール</title>
<style>
:root {
  --bg: #0d0d0d;
  --card: #161616;
  --border: rgba(255,255,255,.1);
  --gold: #c9a84c;
  --white: #f0ede6;
  --dim: #6b6560;
  --green: #27ae60;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--white);
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
  min-height: 100vh;
  padding-bottom: 40px;
}

/* ── ヘッダー ── */
header {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 10;
}
.logo { font-size: 15px; font-weight: 700; color: var(--gold); letter-spacing: .05em; }
.date-label { font-size: 11px; color: var(--dim); }

/* ── メイン ── */
main { padding: 16px; max-width: 560px; margin: 0 auto; }

/* ── APIバナー ── */
.api-banner {
  background: rgba(201,168,76,.08);
  border: 1px solid rgba(201,168,76,.35);
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 16px;
}
.api-banner p { font-size: 12px; color: var(--dim); margin-bottom: 10px; line-height: 1.6; }
.api-banner a { color: var(--gold); }
.api-input {
  width: 100%;
  background: rgba(0,0,0,.4);
  border: 1px solid rgba(201,168,76,.4);
  color: var(--white);
  padding: 10px 12px;
  border-radius: 6px;
  font-size: 13px;
  font-family: monospace;
  margin-bottom: 8px;
  outline: none;
}
.save-btn {
  width: 100%;
  padding: 10px;
  background: var(--gold);
  border: none;
  color: #000;
  border-radius: 6px;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
}

/* ── 全件生成ボタン ── */
.gen-all-btn {
  width: 100%;
  padding: 16px;
  background: linear-gradient(135deg, #c9a84c 0%, #7a6330 100%);
  border: none;
  color: #fff;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  margin-bottom: 20px;
  letter-spacing: .05em;
  transition: opacity .2s;
}
.gen-all-btn:disabled { opacity: .45; cursor: not-allowed; }

/* ── 投稿カード ── */
.post-card {
  background: var(--card);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 14px;
  border: 1px solid var(--border);
}
.card-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.time-emoji { font-size: 22px; }
.time-info { flex: 1; }
.time-label { font-size: 14px; font-weight: 700; }
.time-sub { font-size: 11px; color: var(--dim); margin-top: 2px; }
.posted-badge {
  font-size: 10px;
  background: rgba(39,174,96,.2);
  color: var(--green);
  border: 1px solid rgba(39,174,96,.4);
  border-radius: 20px;
  padding: 3px 8px;
  display: none;
}
.posted-badge.show { display: inline-block; }

.post-text {
  background: rgba(0,0,0,.3);
  border-radius: 8px;
  padding: 14px;
  font-size: 13px;
  line-height: 1.9;
  color: var(--white);
  min-height: 90px;
  white-space: pre-wrap;
  word-break: break-all;
  margin-bottom: 12px;
  border: 1px solid rgba(255,255,255,.05);
}
.post-text.placeholder { color: var(--dim); font-size: 12px; }
.post-text.loading { color: var(--dim); font-size: 12px; }

.char-count { font-size: 10px; color: var(--dim); text-align: right; margin-top: -8px; margin-bottom: 10px; }
.char-count.over { color: #e74c3c; }

.card-actions { display: flex; gap: 8px; }
.btn-regen {
  flex: 1;
  padding: 10px;
  background: none;
  border: 1px solid var(--border);
  color: var(--dim);
  border-radius: 7px;
  font-size: 12px;
  cursor: pointer;
  transition: border-color .2s, color .2s;
}
.btn-regen:hover { border-color: rgba(255,255,255,.3); color: var(--white); }
.btn-regen:disabled { opacity: .4; cursor: not-allowed; }

.btn-post {
  flex: 2;
  padding: 10px;
  background: #000;
  border: 1.5px solid rgba(255,255,255,.25);
  color: var(--white);
  border-radius: 7px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  text-decoration: none;
  transition: background .2s;
}
.btn-post:hover { background: #111; }
.btn-post.disabled { opacity: .35; pointer-events: none; }

/* ── 設定リンク ── */
.settings-link {
  text-align: center;
  padding: 16px;
  font-size: 11px;
  color: var(--dim);
  cursor: pointer;
}
.settings-link:hover { color: var(--white); }

/* ── トースト ── */
.toast {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%);
  background: #222;
  border: 1px solid rgba(255,255,255,.1);
  color: var(--white);
  padding: 10px 22px;
  border-radius: 24px;
  font-size: 13px;
  z-index: 9999;
  opacity: 0;
  transition: opacity .25s;
  pointer-events: none;
  white-space: nowrap;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <div class="logo">⌚ 時計転売 投稿ツール</div>
  <div class="date-label" id="dateLabel"></div>
</header>

<main>

  <!-- APIキー未設定バナー -->
  <div class="api-banner" id="apiBanner" style="display:none">
    <p>Gemini APIキーを入力してください。<br>
    無料で使えます →
    <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a></p>
    <input type="password" class="api-input" id="apiKeyInput" placeholder="AIza...">
    <button class="save-btn" onclick="saveApiKey()">保存する</button>
  </div>

  <!-- 全件生成 -->
  <button class="gen-all-btn" id="genAllBtn" onclick="generateAll()">
    ✨ 今日の投稿を3件まとめて生成
  </button>

  <!-- 朝 -->
  <div class="post-card">
    <div class="card-header">
      <div class="time-emoji">🌅</div>
      <div class="time-info">
        <div class="time-label" style="color:#f39c12">朝の投稿</div>
        <div class="time-sub">推奨：7:00〜9:00</div>
      </div>
      <span class="posted-badge" id="badge-morning">投稿済み</span>
    </div>
    <div class="post-text placeholder" id="text-morning">「✨ 今日の投稿を3件まとめて生成」を押してください</div>
    <div class="char-count" id="count-morning"></div>
    <div class="card-actions">
      <button class="btn-regen" id="regen-morning" onclick="generateOne('morning')">🔄 再生成</button>
      <a class="btn-post disabled" id="btn-morning" href="#" target="_blank" rel="noopener" onclick="markPosted('morning')">
        <span style="font-weight:900;font-size:15px">𝕏</span> 投稿する
      </a>
    </div>
  </div>

  <!-- 昼 -->
  <div class="post-card">
    <div class="card-header">
      <div class="time-emoji">☀️</div>
      <div class="time-info">
        <div class="time-label" style="color:#3498db">昼の投稿</div>
        <div class="time-sub">推奨：12:00〜13:00</div>
      </div>
      <span class="posted-badge" id="badge-noon">投稿済み</span>
    </div>
    <div class="post-text placeholder" id="text-noon">「✨ 今日の投稿を3件まとめて生成」を押してください</div>
    <div class="char-count" id="count-noon"></div>
    <div class="card-actions">
      <button class="btn-regen" id="regen-noon" onclick="generateOne('noon')">🔄 再生成</button>
      <a class="btn-post disabled" id="btn-noon" href="#" target="_blank" rel="noopener" onclick="markPosted('noon')">
        <span style="font-weight:900;font-size:15px">𝕏</span> 投稿する
      </a>
    </div>
  </div>

  <!-- 晩 -->
  <div class="post-card">
    <div class="card-header">
      <div class="time-emoji">🌙</div>
      <div class="time-info">
        <div class="time-label" style="color:#a29bfe">晩の投稿</div>
        <div class="time-sub">推奨：20:00〜22:00</div>
      </div>
      <span class="posted-badge" id="badge-evening">投稿済み</span>
    </div>
    <div class="post-text placeholder" id="text-evening">「✨ 今日の投稿を3件まとめて生成」を押してください</div>
    <div class="char-count" id="count-evening"></div>
    <div class="card-actions">
      <button class="btn-regen" id="regen-evening" onclick="generateOne('evening')">🔄 再生成</button>
      <a class="btn-post disabled" id="btn-evening" href="#" target="_blank" rel="noopener" onclick="markPosted('evening')">
        <span style="font-weight:900;font-size:15px">𝕏</span> 投稿する
      </a>
    </div>
  </div>

  <div class="settings-link" onclick="showSettings()">⚙️ APIキーを変更する</div>

</main>

<div class="toast" id="toast"></div>

<script>
// ── 設定 ──────────────────────────────
const SLOTS = {
  morning: {
    label: '朝',
    prompt: `朝（7〜9時）に投稿する、時計転売・物販の「教育・ノウハウ」系ツイートを1件作成してください。
読者が「今日も頑張ろう」と思えるモチベーション系・気づき系の内容が理想です。
具体的な仕入れのコツ、目利きのポイント、マインドセットなどを扱ってください。`
  },
  noon: {
    label: '昼',
    prompt: `昼（12〜13時）に投稿する、時計転売・物販の「実例・相場」系ツイートを1件作成してください。
実際の仕入れ事例（ブランド・購入価格・売値・利益など具体的な数字を含む）や、
今注目の時計モデルの相場情報などを扱ってください。`
  },
  evening: {
    label: '晩',
    prompt: `夜（20〜22時）に投稿する、時計転売・物販の「問いかけ・振り返り」系ツイートを1件作成してください。
フォロワーにコメントや反応を促す問いかけ、または今日の活動の振り返りや気づきを発信する内容が理想です。`
  }
};

const BASE_STYLE = `【投稿スタイルのルール】
・時計転売・物販のノウハウや情報を発信する専門アカウントとして書く
・ズバッと言い切るスタイル。断定的で読者に信頼感を与える
・⌚💰🔥📌⚠️✅などの絵文字を2〜3個使う
・#時計物販 #副業 などのハッシュタグを最後に1〜2個入れる
・140文字以内に収める（短くてもOK、絶対に140文字を超えないこと）
・説明文や前置きは不要。投稿文だけ出力すること`;

// ── 状態 ──────────────────────────────
const today = new Date().toLocaleDateString('ja-JP');
let posts = { morning: null, noon: null, evening: null };
let postedToday = {};

// ── 初期化 ──────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  // 日付表示
  document.getElementById('dateLabel').textContent =
    new Date().toLocaleDateString('ja-JP', { month:'long', day:'numeric', weekday:'short' });

  // APIキー確認
  const key = getApiKey();
  if (!key) {
    document.getElementById('apiBanner').style.display = 'block';
    document.getElementById('genAllBtn').disabled = true;
  }

  // 今日のデータ復元
  const saved = JSON.parse(localStorage.getItem('posts_' + today) || '{}');
  postedToday = JSON.parse(localStorage.getItem('posted_' + today) || '{}');
  for (const slot of Object.keys(SLOTS)) {
    if (saved[slot]) {
      posts[slot] = saved[slot];
      applyPost(slot, saved[slot]);
    }
    if (postedToday[slot]) {
      document.getElementById('badge-' + slot).classList.add('show');
    }
  }
});

// ── APIキー ──────────────────────────────
function getApiKey() {
  return localStorage.getItem('gemini_key') || '';
}

function saveApiKey() {
  const key = document.getElementById('apiKeyInput').value.trim();
  if (!key) { showToast('キーを入力してください'); return; }
  localStorage.setItem('gemini_key', key);
  document.getElementById('apiBanner').style.display = 'none';
  document.getElementById('genAllBtn').disabled = false;
  showToast('✅ APIキーを保存しました');
}

function showSettings() {
  const banner = document.getElementById('apiBanner');
  banner.style.display = 'block';
  const k = getApiKey();
  if (k) document.getElementById('apiKeyInput').value = k;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── Gemini呼び出し ──────────────────────────────
const GEMINI_MODELS = [
  'gemini-2.5-flash',
  'gemini-2.5-flash-preview-04-17',
  'gemini-2.0-flash-lite',
  'gemini-1.5-flash-latest',
];

async function callGemini(prompt) {
  const key = getApiKey();
  let lastErr = '';
  for (const model of GEMINI_MODELS) {
    try {
      const res = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: { temperature: 0.95, maxOutputTokens: 512 }
          })
        }
      );
      const data = await res.json();
      if (!res.ok) {
        const msg = data?.error?.message || `APIエラー ${res.status}`;
        // モデルが使えない場合は次を試す
        if (msg.includes('not found') || msg.includes('no longer available') || msg.includes('not supported')) {
          lastErr = msg;
          continue;
        }
        throw new Error(msg);
      }
      const text = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
      if (!text) throw new Error('レスポンスが空です');
      return text.trim();
    } catch(e) {
      if (e.message.includes('not found') || e.message.includes('no longer available') || e.message.includes('not supported')) {
        lastErr = e.message;
        continue;
      }
      throw e;
    }
  }
  throw new Error('利用可能なGeminiモデルが見つかりません: ' + lastErr);
}

// ── 投稿文をカードに反映 ──────────────────────────────
function applyPost(slot, text) {
  const textEl = document.getElementById('text-' + slot);
  const countEl = document.getElementById('count-' + slot);
  const btn = document.getElementById('btn-' + slot);

  textEl.textContent = text;
  textEl.classList.remove('placeholder', 'loading');

  const len = text.length;
  countEl.textContent = `${len} / 140文字`;
  countEl.className = 'char-count' + (len > 140 ? ' over' : '');

  // Xのintent URLにセット（投稿ボタン有効化）
  btn.href = `https://x.com/intent/tweet?text=${encodeURIComponent(text)}`;
  btn.classList.remove('disabled');
}

// ── 1件生成 ──────────────────────────────
async function generateOne(slot) {
  const key = getApiKey();
  if (!key) { showToast('APIキーを設定してください'); return; }

  const textEl = document.getElementById('text-' + slot);
  const regenBtn = document.getElementById('regen-' + slot);
  const postBtn = document.getElementById('btn-' + slot);

  textEl.textContent = '⏳ 生成中...';
  textEl.classList.add('loading');
  textEl.classList.remove('placeholder');
  document.getElementById('count-' + slot).textContent = '';
  regenBtn.disabled = true;
  postBtn.classList.add('disabled');

  try {
    const prompt = `${SLOTS[slot].prompt}\n\n${BASE_STYLE}`;
    const text = await callGemini(prompt);
    posts[slot] = text;
    applyPost(slot, text);
    savePosts();
  } catch(e) {
    textEl.textContent = '❌ 生成失敗: ' + e.message;
    textEl.classList.remove('loading');
    showToast('❌ ' + e.message);
  } finally {
    regenBtn.disabled = false;
  }
}

// ── 全件生成 ──────────────────────────────
async function generateAll() {
  const key = getApiKey();
  if (!key) { showToast('APIキーを設定してください'); return; }

  const btn = document.getElementById('genAllBtn');
  btn.disabled = true;
  btn.textContent = '⏳ 生成中...';

  try {
    // 3件を並列生成（速い）
    await Promise.all(Object.keys(SLOTS).map(slot => generateOne(slot)));
    showToast('✅ 朝・昼・晩の投稿を生成しました！');
  } catch(e) {
    showToast('❌ 一部の生成に失敗しました');
  } finally {
    btn.disabled = false;
    btn.textContent = '✨ 今日の投稿を3件まとめて再生成';
  }
}

// ── 投稿済みマーク ──────────────────────────────
function markPosted(slot) {
  postedToday[slot] = true;
  localStorage.setItem('posted_' + today, JSON.stringify(postedToday));
  document.getElementById('badge-' + slot).classList.add('show');
  setTimeout(() => showToast('✅ 投稿しました！お疲れ様です'), 800);
}

// ── 保存 ──────────────────────────────
function savePosts() {
  localStorage.setItem('posts_' + today, JSON.stringify(posts));
}

// ── トースト ──────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}
</script>
</body>
</html>
